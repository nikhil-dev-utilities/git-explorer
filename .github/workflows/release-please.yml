# Maintains an always-current release PR with the computed next version and a
# generated CHANGELOG (per release-please-config.json / .release-please-manifest.json).
# Merging that PR creates a version tag.
#
# The GoReleaser job runs in this same workflow run, gated on release-please's own
# release_created output, rather than as a separate workflow triggered by the tag
# push: a tag (or any ref) created via the default GITHUB_TOKEN does not trigger other
# workflows — that's a deliberate GitHub Actions anti-loop protection, not a bug — so a
# separate `on: push: tags:` workflow would simply never fire. Keeping both jobs in one
# run sidesteps that entirely.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  goreleaser:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
